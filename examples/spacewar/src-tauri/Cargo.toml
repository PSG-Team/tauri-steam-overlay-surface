[package]
name = "spacewar-overlay-example"
version = "0.1.0"
description = "Steam overlay surface example against Spacewar (AppID 480)"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-steam-overlay-surface = { path = "../../../crates/tauri-plugin-steam-overlay-surface" }
steamworks = "0.13"
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
