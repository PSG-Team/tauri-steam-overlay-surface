<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spacewar Overlay Example</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 30% 20%, #1e1432, #0b0916 70%);
        color: #e8e4f4;
        font-family: system-ui, sans-serif;
      }
      main {
        text-align: center;
        max-width: 32rem;
        padding: 2rem;
      }
      h1 {
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      kbd {
        background: #2a2140;
        border: 1px solid #4a3d6e;
        border-radius: 0.3rem;
        padding: 0.15rem 0.5rem;
        font-size: 1.05em;
      }
      dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 0.4rem 1.2rem;
        justify-content: center;
        text-align: left;
        margin-top: 2rem;
      }
      dt {
        color: #9c92bd;
      }
      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .ok {
        color: #7ee2a8;
      }
      .bad {
        color: #f08c8c;
      }
      p.hint {
        color: #9c92bd;
        margin-top: 2rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Steam Overlay Surface</h1>
      <p>
        Press <kbd>Shift</kbd> + <kbd>Tab</kbd> to open the Steam overlay,
        <kbd>F12</kbd> for a Steam screenshot.
      </p>
      <dl>
        <dt>Steam client</dt>
        <dd id="steam">…</dd>
        <dt>Overlay hooked</dt>
        <dd id="overlay">…</dd>
        <dt>Decoy surface presenting</dt>
        <dd id="surface">…</dd>
      </dl>
      <p class="hint">
        Steam must be running before you launch this app. The status above
        polls once a second; all three green means Shift+Tab will work.
      </p>
    </main>
    <script>
      const invoke = window.__TAURI__.core.invoke;

      function mark(id, ok, okText, badText) {
        const el = document.getElementById(id);
        el.textContent = ok ? okText : badText;
        el.className = ok ? "ok" : "bad";
      }

      async function refresh() {
        try {
          const s = await invoke("overlay_status");
          mark("steam", s.steam_available, "connected", "not running");
          mark("overlay", s.overlay_enabled, "yes", "no");
          mark("surface", s.surface_active, "yes", "no");
        } catch (err) {
          console.error(err);
        }
      }
      refresh();
      setInterval(refresh, 1000);

      // Shift+Tab and F12 land in the webview process, invisible to Steam's
      // input hooks — forward them to Rust (ActivateGameOverlay /
      // TriggerScreenshot).
      window.addEventListener("keydown", (e) => {
        if (e.shiftKey && e.key === "Tab") {
          e.preventDefault();
          invoke("activate_overlay");
        } else if (e.key === "F12") {
          e.preventDefault();
          invoke("trigger_screenshot");
        }
      });
    </script>
  </body>
</html>
